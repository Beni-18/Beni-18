<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img">
<desc>ED Deterioration Monitor: Warns emergency doctors when a patient starts getting worse, combining vital trends with clinical guidelines.</desc>
<style>
