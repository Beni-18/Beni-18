<svg xmlns="http://www.w3.org/2000/svg" width="170" height="190" viewBox="0 0 170 190" role="img">
<desc>9. XGBoost on milk quality (Milk_Quality_Predictor)</desc>
<style>
text{font-family:ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono','Courier New',monospace} .s{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cur{animation:blink 1.06s steps(1) infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .5s ease-out forwards}
.rise{opacity:0;animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards}
</style>
<rect width="170" height="190" fill="#ffffff"/><rect x=".5" y=".5" width="169" height="189" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="0" y="0" width="170" height="4" fill="#bc4c00"/><text x="14.0" y="30.0" font-size="14" fill="#bc4c00" text-anchor="start" font-weight="700" xml:space="preserve">09</text><text x="156.0" y="30.0" font-size="12" fill="#818b98" text-anchor="end" font-weight="400" xml:space="preserve">ENS</text><g class="rise" style="animation-delay:0.27s"><text x="14.0" y="90.0" font-size="50" fill="#1f2328" text-anchor="start" font-weight="700" class="s" xml:space="preserve">Mk</text></g><text x="14.0" y="122.0" font-size="15" fill="#bc4c00" text-anchor="start" font-weight="700" xml:space="preserve">XGBoost</text><text x="14.0" y="144.0" font-size="13.5" fill="#59636e" text-anchor="start" font-weight="400" xml:space="preserve">milk quality</text>
</svg>
