<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="56" viewBox="0 0 1200 56" role="img">
<desc>Model zoo families.</desc>
<style>
text{font-family:ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono','Courier New',monospace} .s{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cur{animation:blink 1.06s steps(1) infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .5s ease-out forwards}
.rise{opacity:0;animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards}
</style>
<rect width="1200" height="56" fill="#0d1117"/><rect x="40" y="20" width="14" height="14" fill="#6cb6ff"/><text x="62" y="32" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#f0f6fc">regression </tspan><tspan fill="#db6d28">3</tspan></text><rect x="196.8" y="20" width="14" height="14" fill="#4493f8"/><text x="218.8" y="32" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#f0f6fc">classification </tspan><tspan fill="#db6d28">6</tspan></text><rect x="387.20000000000005" y="20" width="14" height="14" fill="#db6d28"/><text x="409.20000000000005" y="32" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#f0f6fc">ensembles </tspan><tspan fill="#db6d28">7</tspan></text><rect x="535.6" y="20" width="14" height="14" fill="#ffa657"/><text x="557.6" y="32" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#f0f6fc">clustering </tspan><tspan fill="#db6d28">4</tspan></text><rect x="692.4000000000001" y="20" width="14" height="14" fill="#9198a1"/><text x="714.4000000000001" y="32" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#f0f6fc">feature selection </tspan><tspan fill="#db6d28">1</tspan></text>
</svg>
