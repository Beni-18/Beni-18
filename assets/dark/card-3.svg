<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img">
<desc>DockMind: Manage Docker containers by typing plain English. A local Llama 3 model does the work, so nothing leaves your machine.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes in{from{opacity:0}to{opacity:1}}
.in{opacity:0;animation:in .6s ease-out forwards}
</style>
<rect width="600" height="280" fill="#0d1117"/><rect x="3.5" y="3.5" width="593" height="273" rx="6" fill="#151b23" stroke="#3d444d"/><g class="in" style="animation-delay:0.05s"><text x="27.0" y="52.0" font-size="22" fill="#f0f6fc" text-anchor="start" font-weight="600" xml:space="preserve">DockMind</text><text x="573.0" y="50.0" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400" class="m" xml:space="preserve">Solo</text></g><text x="27.0" y="86.0" font-size="15" fill="#9198a1" text-anchor="start" font-weight="400" xml:space="preserve">Manage Docker containers by typing plain English. A local</text><text x="27.0" y="108.0" font-size="15" fill="#9198a1" text-anchor="start" font-weight="400" xml:space="preserve">Llama 3 model does the work, so nothing leaves your machine.</text><g class="in" style="animation-delay:0.15s"><text x="27.0" y="172.0" font-size="26" fill="#41b445" text-anchor="start" font-weight="600" xml:space="preserve">7</text><text x="27.0" y="194.0" font-size="13" fill="#9198a1" text-anchor="start" font-weight="400" xml:space="preserve">allowed actions</text></g><line x1="209.0" y1="146" x2="209.0" y2="200" stroke="#3d444d"/><g class="in" style="animation-delay:0.21s"><text x="225.0" y="172.0" font-size="26" fill="#41b445" text-anchor="start" font-weight="600" xml:space="preserve">0</text><text x="225.0" y="194.0" font-size="13" fill="#9198a1" text-anchor="start" font-weight="400" xml:space="preserve">cloud calls</text></g><line x1="391.0" y1="146" x2="391.0" y2="200" stroke="#3d444d"/><g class="in" style="animation-delay:0.27s"><text x="407.0" y="172.0" font-size="26" fill="#41b445" text-anchor="start" font-weight="600" xml:space="preserve">JWT</text><text x="407.0" y="194.0" font-size="13" fill="#9198a1" text-anchor="start" font-weight="400" xml:space="preserve">auth and rate limits</text></g><line x1="27" y1="222.5" x2="573" y2="222.5" stroke="#3d444d"/><text x="27.0" y="250.0" font-size="12.5" fill="#656c76" text-anchor="start" font-weight="400" class="m" xml:space="preserve">FastAPI · React · Ollama · Docker SDK · PostgreSQL</text><text x="573.0" y="250.0" font-size="15" fill="#d07ef7" text-anchor="end" font-weight="600" xml:space="preserve">↗</text><rect class="in" style="animation-delay:0.800s" x="532" y="238" width="1" height="1" fill="#19202a"/><rect class="in" style="animation-delay:0.808s" x="538" y="238" width="1" height="1" fill="#19202a"/><rect class="in" style="animation-delay:0.816s" x="529" y="241" width="1" height="1" fill="#19202a"/><rect class="in" style="animation-delay:0.824s" x="535" y="241" width="1" height="1" fill="#19202a"/><rect class="in" style="animation-delay:0.832s" x="541" y="241" width="1" height="1" fill="#19202a"/><rect class="in" style="animation-delay:0.840s" x="532" y="247" width="1" height="1" fill="#19202a"/><rect class="in" style="animation-delay:0.848s" x="535" y="247" width="1" height="1" fill="#19202a"/><rect class="in" style="animation-delay:0.856s" x="538" y="247" width="1" height="1" fill="#19202a"/><rect class="in" style="animation-delay:0.864s" x="529" y="250" width="1" height="1" fill="#19202a"/><rect class="in" style="animation-delay:0.872s" x="532" y="250" width="1" height="1" fill="#19202a"/><rect class="in" style="animation-delay:0.880s" x="535" y="250" width="1" height="1" fill="#19202a"/><rect class="in" style="animation-delay:0.888s" x="538" y="250" width="1" height="1" fill="#19202a"/><rect class="in" style="animation-delay:0.896s" x="541" y="250" width="1" height="1" fill="#19202a"/><rect class="in" style="animation-delay:0.904s" x="532" y="253" width="1" height="1" fill="#19202a"/><rect class="in" style="animation-delay:0.912s" x="535" y="253" width="1" height="1" fill="#19202a"/><rect class="in" style="animation-delay:0.920s" x="538" y="253" width="1" height="1" fill="#19202a"/>
