<svg xmlns="http://www.w3.org/2000/svg" width="600" height="124" viewBox="0 0 600 124" role="img">
<desc>APHELION AI: Physics-informed solar flare forecasting</desc>
<style>
text{font-family:ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono','Courier New',monospace} .s{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cur{animation:blink 1.06s steps(1) infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .5s ease-out forwards}
.rise{opacity:0;animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards}
</style>
<rect width="600" height="124" fill="#0d1117"/><rect x=".5" y=".5" width="599" height="123" fill="#151b23" stroke="#3d444d"/><rect x="0" y="0" width="3" height="124" fill="#4493f8"/><g class="rise" style="animation-delay:0.10s"><text x="24.0" y="42.0" font-size="22" fill="#f0f6fc" text-anchor="start" font-weight="700" class="s" xml:space="preserve">APHELION AI</text><text x="576.0" y="40.0" font-size="13" fill="#db6d28" text-anchor="end" font-weight="400" xml:space="preserve">ISRO BAH</text></g><text x="24.0" y="72.0" font-size="15" fill="#9198a1" text-anchor="start" font-weight="400" class="s" xml:space="preserve">Physics-informed solar flare forecasting</text><text x="24" y="102" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#656c76">ml · typescript</tspan><tspan fill="#4493f8">   ↗</tspan></text>
</svg>
