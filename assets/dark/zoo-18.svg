<svg xmlns="http://www.w3.org/2000/svg" width="170" height="190" viewBox="0 0 170 190" role="img">
<desc>18. XGBoost on diabetes progression (XGBOOSTING)</desc>
<style>
text{font-family:ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono','Courier New',monospace} .s{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cur{animation:blink 1.06s steps(1) infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .5s ease-out forwards}
.rise{opacity:0;animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards}
</style>
<rect width="170" height="190" fill="#0d1117"/><rect x=".5" y=".5" width="169" height="189" fill="#151b23" stroke="#3d444d"/><rect x="0" y="0" width="170" height="4" fill="#db6d28"/><text x="14.0" y="30.0" font-size="14" fill="#db6d28" text-anchor="start" font-weight="700" xml:space="preserve">18</text><text x="156.0" y="30.0" font-size="12" fill="#656c76" text-anchor="end" font-weight="400" xml:space="preserve">ENS</text><g class="rise" style="animation-delay:0.54s"><text x="14.0" y="90.0" font-size="50" fill="#f0f6fc" text-anchor="start" font-weight="700" class="s" xml:space="preserve">Xg</text></g><text x="14.0" y="122.0" font-size="15" fill="#db6d28" text-anchor="start" font-weight="700" xml:space="preserve">XGBoost</text><text x="14.0" y="144.0" font-size="13.5" fill="#9198a1" text-anchor="start" font-weight="400" xml:space="preserve">diabetes</text><text x="14.0" y="160.0" font-size="13.5" fill="#9198a1" text-anchor="start" font-weight="400" xml:space="preserve">progression</text>
</svg>
