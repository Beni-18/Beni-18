<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img">
<desc>Training log: repos created per month since the account began, in five epochs.</desc>
<style>
text{font-family:ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono','Courier New',monospace} .s{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cur{animation:blink 1.06s steps(1) infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .5s ease-out forwards}
.rise{opacity:0;animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 3.2s cubic-bezier(.4,0,.2,1) .6s forwards}
.bar{transform-box:fill-box;transform-origin:bottom;opacity:0;animation:grow .5s ease-out forwards}
@keyframes grow{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
@keyframes ping{0%{r:4;opacity:.9}100%{r:14;opacity:0}}
.ping{animation:ping 1.6s ease-out 3.8s infinite}
</style>
