<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img">
<desc>Passport Mitra: AI assistant that answers Indian passport and visa questions in your own language, citing the official rule it used.</desc>
<style>
