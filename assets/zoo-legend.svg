<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70" role="img">
<desc>Legend for the model zoo families.</desc>
<style>
text{font-family:ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono','Courier New',monospace} .s{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cur{animation:blink 1.06s steps(1) infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .5s ease-out forwards}
.rise{opacity:0;animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards}
</style>
<rect width="1200" height="70" fill="#0A0C0F"/><text x="40.0" y="28.0" font-size="14" fill="#8B95A4" text-anchor="start" font-weight="400"  xml:space="preserve">21 elements · each one trained, evaluated and shipped as a Streamlit app · numbered in the order they were built</text><rect x="40" y="44" width="14" height="14" fill="#7FA8FF"/><text x="62.0" y="56.0" font-size="13" fill="#E8EDF4" text-anchor="start" font-weight="400"  xml:space="preserve">REG regression (2)</text><rect x="232.4" y="44" width="14" height="14" fill="#2F6BFF"/><text x="254.4" y="56.0" font-size="13" fill="#E8EDF4" text-anchor="start" font-weight="400"  xml:space="preserve">CLF classification (6)</text><rect x="456.0" y="44" width="14" height="14" fill="#38BDF8"/><text x="478.0" y="56.0" font-size="13" fill="#E8EDF4" text-anchor="start" font-weight="400"  xml:space="preserve">ENS ensembles (7)</text><rect x="640.6" y="44" width="14" height="14" fill="#8B7CFF"/><text x="662.6" y="56.0" font-size="13" fill="#E8EDF4" text-anchor="start" font-weight="400"  xml:space="preserve">CLU clustering (4)</text><rect x="833.0" y="44" width="14" height="14" fill="#A9B4C4"/><text x="855.0" y="56.0" font-size="13" fill="#E8EDF4" text-anchor="start" font-weight="400"  xml:space="preserve">SEL selection &amp; validation (2)</text>
</svg>
